spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/txi_db}
    username: ${SPRING_DATASOURCE_USERNAME:txi}
    password: ${SPRING_DATASOURCE_PASSWORD:txi_pass}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false

flyway:
  enabled: false

anthropic:
  apiKey: ${ANTHROPIC_API_KEY:}
  workspaceId: ${ANTHROPIC_WORKSPACE_ID:}
  organizationId: ${ANTHROPIC_ORGANIZATION_ID:}
  apiUrl: ${ANTHROPIC_API_URL:https://api.anthropic.com}
  model: ${ANTHROPIC_MODEL:claude-3-5-sonnet-latest}

server:
  port: 8080
