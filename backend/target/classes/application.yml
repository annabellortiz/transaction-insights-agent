spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/txi_db}
    username: ${SPRING_DATASOURCE_USERNAME:txi}
    password: ${SPRING_DATASOURCE_PASSWORD:txi_pass}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false

flyway:
  enabled: true
  locations: classpath:db/migration,filesystem:./infra/init-db

anthropic:
  apiKey: ${ANTHROPIC_API_KEY:}

server:
  port: 8080
