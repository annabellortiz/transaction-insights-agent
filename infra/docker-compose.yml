services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: txi_db
      POSTGRES_USER: txi
      POSTGRES_PASSWORD: txi_pass
    volumes:
      - txi-db-data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U txi -d txi_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/txi_db
      SPRING_DATASOURCE_USERNAME: txi
      SPRING_DATASOURCE_PASSWORD: txi_pass
      SPRING_FLYWAY_ENABLED: "false"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_WORKSPACE_ID: ${ANTHROPIC_WORKSPACE_ID}
      ANTHROPIC_ORGANIZATION_ID: ${ANTHROPIC_ORGANIZATION_ID}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-3-5-sonnet-latest}
    ports:
      - "8080:8080"
    depends_on:
      - db

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8081:80"
    depends_on:
      - db

volumes:
  txi-db-data:
